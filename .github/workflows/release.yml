name: 📦 Build & Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # permite disparar manualmente pela aba Actions

permissions:
  contents: write         # necessário para criar a Release e anexar o .exe

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Generate icon
        run: python installer/make_icon.py

      - name: Build installer (.exe)
        run: python installer/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FicaQuietoKalucky-Setup
          path: installer/dist/FicaQuietoKalucky-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/FicaQuietoKalucky-Setup.exe
          generate_release_notes: true
          body: |
            ## FicaQuietoKalucky ${{ github.ref_name }}

            Instalador para Windows. Baixe **FicaQuietoKalucky-Setup.exe** abaixo e
            dê dois cliques.

            O assistente instala o Python (se necessário), as dependências, cria a
            configuração com o seu Token e ID do servidor, configura o autostart e
            inicia o bot automaticamente.
